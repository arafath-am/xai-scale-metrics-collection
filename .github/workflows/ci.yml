name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r exporters/cooling_rest_exporter/requirements.txt
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        flake8 exporters/cooling_rest_exporter/app.py tools/targetgen.py --max-line-length=100
    
    - name: Check formatting with black
      run: |
        black --check exporters/cooling_rest_exporter/app.py tools/targetgen.py
    
    - name: Run tests
      run: |
        cd exporters/cooling_rest_exporter
        pytest test_app.py -v --cov=app --cov-report=term-missing
    
    - name: Validate Prometheus configs
      run: |
        docker run --rm -v $(pwd)/configs/prometheus:/config \
          prom/prometheus:latest \
          promtool check config /config/cell-prometheus.yml
  
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        cd exporters/cooling_rest_exporter
        docker build -t cooling-exporter:test .
    
    - name: Test Docker container
      run: |
        docker run -d --name test-exporter -p 8000:8000 cooling-exporter:test
        sleep 5
        curl -f http://localhost:8000/healthz || exit 1
        curl -f http://localhost:8000/metrics | grep -q cooling_supply_air_temp_celsius || exit 1
        docker stop test-exporter
