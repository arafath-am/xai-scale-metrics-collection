global:
  scrape_interval: 30s
  evaluation_interval: 30s

external_labels:
  dc: dc1
  row: r12
  replica: row-a

scrape_configs:
  - job_name: snmp_infra
    scrape_interval: 30s
    metrics_path: /snmp
    params:
      auth: [snmpv3_main]
      module: [if_mib]
    static_configs:
      - targets: ['10.20.0.10','10.20.0.11','10.20.0.50']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: snmp-row-12.obsv.local:9116

  - job_name: cooling_gateway
    scrape_interval: 30s
    static_configs:
      - targets: ['cooling-gw-a.fac.local:8000']
