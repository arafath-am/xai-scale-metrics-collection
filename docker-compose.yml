version: '3.8'

services:
  # Mock DCGM exporter (fake GPU metrics)
  mock-dcgm:
    build:
      context: ./mock_exporters
      dockerfile: Dockerfile
    container_name: mock-dcgm-exporter
    ports:
      - "9400:9400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9400/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cooling plant exporter (real implementation)
  cooling-exporter:
    build:
      context: ./exporters/cooling_rest_exporter
      dockerfile: Dockerfile
    container_name: cooling-exporter
    ports:
      - "8000:8000"
    environment:
      - LISTEN_HOST=0.0.0.0
      - LISTEN_PORT=8000
      - POLL_INTERVAL=15
      - LOG_LEVEL=INFO
      # Uses sample_payload.json for demo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Prometheus (scrapes all exporters)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - mock-dcgm
      - cooling-exporter

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./demo/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./demo/grafana-dashboard.json:/var/lib/grafana/dashboards/gpu-dashboard.json:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: xai-monitoring
