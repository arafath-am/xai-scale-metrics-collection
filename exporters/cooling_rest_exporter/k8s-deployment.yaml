apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooling-exporter
  namespace: monitoring
  labels:
    app: cooling-exporter
    component: metrics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cooling-exporter
  template:
    metadata:
      labels:
        app: cooling-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: exporter
        image: ghcr.io/yourorg/cooling-exporter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: metrics
          protocol: TCP
        env:
        - name: LISTEN_HOST
          value: "0.0.0.0"
        - name: LISTEN_PORT
          value: "8000"
        - name: COOLING_API_URL
          valueFrom:
            configMapKeyRef:
              name: cooling-exporter-config
              key: api_url
        - name: POLL_INTERVAL
          value: "15"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: cooling-exporter
  namespace: monitoring
  labels:
    app: cooling-exporter
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    app: cooling-exporter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cooling-exporter-config
  namespace: monitoring
data:
  api_url: "http://cooling-gateway.facility.svc.cluster.local/api/status"
